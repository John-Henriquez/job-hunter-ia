<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Hunter IA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../static/style.css" />
</head>
<body>

<header>
  <div class="logo">job_hunter<span>_ia</span></div>
  <div class="header-right">
    <div class="total-badge" id="headerTotal">cargando...</div>
  </div>
</header>

<div class="layout">
  <aside>

    <div class="sidebar-section">
      <h3>Estadísticas</h3>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="value" id="statTotal">—</div><div class="label">Total</div></div>
        <div class="stat-card"><div class="value" id="statSources">—</div><div class="label">Fuentes</div></div>
        <div class="stat-card"><div class="value" id="statRemote">—</div><div class="label">Remoto</div></div>
        <div class="stat-card"><div class="value" id="statCategories">—</div><div class="label">Categorías</div></div>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>Filtros</h3>
      <div class="filter-group">
        <select id="filterSource" onchange="applyFilters()">
          <option value="">Todas las fuentes</option>
          <option value="getonboard">GetOnBoard</option>
          <option value="arbeitnow">Arbeitnow</option>
        </select>
        <select id="filterModality" onchange="applyFilters()">
          <option value="">Cualquier modalidad</option>
          <option value="Full time">Full time</option>
          <option value="Part time">Part time</option>
          <option value="Freelance">Freelance</option>
        </select>
        <select id="filterWorkMode" onchange="applyFilters()">
          <option value="">Cualquier modo de trabajo</option>
          <option value="remote">Remoto</option>
          <option value="hybrid">Híbrido</option>
          <option value="on-site">Presencial</option>
        </select>
        <select id="filterSeniority" onchange="applyFilters()">
          <option value="">Cualquier seniority</option>
          <option value="Junior">Junior</option>
          <option value="Semi Senior">Semi Senior</option>
          <option value="Senior">Senior</option>
          <option value="Expert">Expert</option>
        </select>
        <select id="filterApplicationStatus" onchange="applyFilters()">
          <option value="">Cualquier estado</option>
          <option value="saved">Guardada</option>
          <option value="applied">Postulada</option>
          <option value="interviewing">En proceso</option>
          <option value="discarded">Descartada</option>
        </select>
        <button class="btn-reset" onclick="resetFilters()">Limpiar filtros</button>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>Actualizar datos</h3>
      <div class="refresh-buttons">
        <button class="btn-refresh all" onclick="triggerFetch('all')">
          <span class="dot"></span> Todas las fuentes
        </button>
        <button class="btn-refresh getonboard" onclick="triggerFetch('getonboard')">
          <span class="dot"></span> GetOnBoard
        </button>
        <button class="btn-refresh arbeitnow" onclick="triggerFetch('arbeitnow')">
          <span class="dot"></span> Arbeitnow
        </button>
      </div>
      <div class="fetch-status" id="fetchStatus"></div>
    </div>

  </aside>

  <main>
    <div class="search-bar">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Buscar por título o empresa..." oninput="onSearchInput()" />
    </div>

    <div class="banner-error" id="bannerError"></div>

    <div class="results-info">
      <span id="resultsInfo">Cargando...</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Posición</th>
            <th>Modalidad</th>
            <th>Seniority</th>
            <th>Categoría</th>
            <th>Fuente</th>
            <th>Estado</th>
            <th>Publicado</th>
          </tr>
        </thead>
        <tbody id="jobsBody">
          <tr><td colspan="7"><div class="loading"><div class="spinner"></div> Cargando vacantes...</div></td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="../static/app.js"></script>
</body>
</html>
